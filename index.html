<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff721b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Snack Attack"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>Snack Attack</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25202a;background:#fff8f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:660px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 15px) 18px calc(env(safe-area-inset-bottom) + 100px)}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}header img{width:53px;height:53px;border-radius:15px}header h1{font-size:23px;margin:0;letter-spacing:-.7px}header small{color:#8a7980}h2{font-size:22px;letter-spacing:-.5px;margin:0 0 13px}.muted{color:#897c7c}.sub{font-size:13px}.panel{background:#fff;border:1px solid #f0e4de;border-radius:19px;padding:17px;margin-bottom:14px;box-shadow:0 4px 17px #4d241008}.hero{background:linear-gradient(135deg,#ff9025,#fa431b);color:white;border:0}.hero .muted{color:#fff4}.hero .metric{font-size:36px;font-weight:800;margin:4px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .panel{margin:0 0 15px}.metric{font-size:26px;font-weight:800}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}.sectionhead h2{margin:0}.btn{border:0;border-radius:13px;padding:12px 16px;background:#ff711b;color:#fff;font-weight:750;min-height:44px}.btn.secondary{background:#fff0e5;color:#bd4517}.btn.ghost{background:#f6f0ed;color:#51434a}.btn.danger{background:#fff0ee;color:#c52920}.btn.small{padding:9px 12px;min-height:37px;font-size:13px}.btn.full{width:100%}.product{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f4eeeb}.product:last-child{border:0}.emoji{width:46px;height:46px;background:#fff1df;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none}.grow{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.stepper{display:flex;align-items:center;gap:7px}.round{border:0;width:40px;height:40px;border-radius:13px;background:#ff741e;color:#fff;font-size:24px;font-weight:600}.round.minus{background:#f7e9e2;color:#ad4e31}.qty{min-width:25px;text-align:center;font-weight:800}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;font-weight:700}.field input{border:1px solid #e9d9d0;background:#fff;border-radius:12px;padding:12px;min-width:0;width:100%;font-size:16px;color:#25202a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:13px;line-height:1.5;color:#8a7272}.empty{text-align:center;padding:25px 14px;color:#85767a}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(15px);border-top:1px solid #f0e2d8;display:flex;justify-content:center;padding:9px 8px calc(env(safe-area-inset-bottom) + 9px);z-index:10}.navinner{display:flex;width:min(100%,660px)}.tab{flex:1;background:none;border:0;padding:6px 1px;color:#918083;font-size:11px;font-weight:650}.tab .ico{display:block;font-size:22px;margin-bottom:4px}.tab.active{color:#e95517}.hide{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.line{border-bottom:1px solid #f1e9e4;padding:12px 0}.line:last-child{border:0}.pill{display:inline-block;background:#fff0e5;color:#ad491b;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#342d31;color:white;padding:12px 18px;border-radius:13px;z-index:30;box-shadow:0 10px 30px #0003;max-width:90vw;text-align:center}.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}.weeknav button{border:0;background:#fff0e5;border-radius:10px;padding:9px 13px}.summarytable{width:100%;border-collapse:collapse;font-size:14px}.summarytable th{text-align:left;color:#8b7b7e;font-size:12px}.summarytable td,.summarytable th{padding:11px 4px;border-bottom:1px solid #f3ebe7}.summarytable td:not(:first-child),.summarytable th:not(:first-child){text-align:right}.total{font-weight:800}dialog{border:0;border-radius:20px;padding:22px;width:min(92vw,420px);box-shadow:0 25px 90px #0005}dialog::backdrop{background:#2d172a77}dialog h2{margin:0 0 12px}dialog p{line-height:1.5}button:focus-visible,input:focus-visible{outline:3px solid #ffc078;outline-offset:2px}
#updateNotice{position:fixed;z-index:9999;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:620px;margin:auto;background:#fff;color:#25202a;border:2px solid #ff721b;border-radius:18px;padding:16px;box-shadow:0 8px 30px #0003}#updateNotice[hidden]{display:none}#updateNotice .update-actions{display:flex;gap:10px;margin-top:12px}#updateNotice button{border:0;border-radius:10px;padding:10px 14px;background:#ff721b;color:white;font-weight:700}#updateNotice button.secondary{background:#f6e9e2;color:#25202a}#deferredUpdate{margin:26px 0 10px;text-align:center}#deferredUpdate[hidden]{display:none}#deferredUpdate button{width:100%;border:1px solid #ff721b;border-radius:14px;background:#fff0e5;color:#a8430c;font-weight:700;padding:14px}body:has(#today.hide) #deferredUpdate{display:none}#appVersion{font-size:12px;color:#8c7b73;text-align:center;padding:10px 0 18px}#deferredUpdate{padding-bottom:4px}</style></head><body><main class="app"><header><img src="./icon-192.png" alt="Snack Attack logo"><div><h1>Snack Attack</h1><small>Daily sales, made easy.</small></div></header><section id="today"></section><section id="products" class="hide"></section><section id="history" class="hide"></section><section id="weekly" class="hide"></section><div id="deferredUpdate" hidden><button type="button" id="footerApplyUpdate">↻ Update Snack Attack</button></div><div id="appVersion">Snack Attack v1.4.0</div></main><nav class="nav" aria-label="Main navigation"><div class="navinner"><button class="tab active" data-tab="today"><span class="ico">🏠</span>Today</button><button class="tab" data-tab="products"><span class="ico">🍪</span>Products</button><button class="tab" data-tab="history"><span class="ico">📅</span>History</button><button class="tab" data-tab="weekly"><span class="ico">📊</span>Weekly</button></div></nav><dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" class="toast hide" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const fresh=()=>({version:1,products:[],days:[],active:null});let state=fresh(), tab='today',weekOffset=0,historyId=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('snack-attack-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let db;async function load(){db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('data','readonly'),r=tx.objectStore('data').get('app');r.onsuccess=()=>{if(r.result)state=r.result;res()};r.onerror=()=>rej(r.error)})}
function save(){return new Promise((res,rej)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(state,'app');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
let saving=false;async function commit(){if(saving)return; saving=true;try{await save();render()}catch(e){alert('Could not save your changes. Check available device storage.');console.error(e)}finally{saving=false}}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hide'),2200)}
function dialog(html){$('#dialogContent').innerHTML=html;$('#dialog').showModal()}
function closeDialog(){$('#dialog').close()}
function dayTotals(day){return day.items.reduce((a,p)=>({sold:a.sold+p.sold,revenue:a.revenue+p.sold*p.price,remaining:a.remaining+p.start-p.sold}),{sold:0,revenue:0,remaining:0})}
function dayItems(day){return day.items.map(p=>`<div class="product"><div class="emoji">${escapeHTML(p.emoji||'🍿')}</div><div class="grow"><div class="name">${escapeHTML(p.name)}</div><div class="sub muted">${money(p.price)} · ${p.start-p.sold} left</div></div><div class="stepper"><button class="round minus" data-action="minus" data-id="${p.id}" ${p.sold===0?'disabled':''} aria-label="Undo one ${escapeHTML(p.name)} sale">−</button><span class="qty">${p.sold}</span><button class="round" data-action="plus" data-id="${p.id}" ${p.sold>=p.start?'disabled':''} aria-label="Sell one ${escapeHTML(p.name)}">+</button></div></div>`).join('')}
function renderToday(){let html='<div class="sectionhead"><h2>Today</h2><span class="pill">'+dateLabel(todayKey())+'</span></div>';const a=state.active;
if(a && a.date!==todayKey()){html+=`<div class="panel"><h2>Previous day still open</h2><p class="note">Your session from ${dateLabel(a.date)} is saved. End that day before starting a new one.</p><button class="btn full" data-action="end">End ${dateLabel(a.date)}</button></div>`}
else if(!a){html+=`<div class="panel hero"><div style="font-size:34px">🍪</div><h2 style="margin:12px 0 8px">Ready to sell?</h2><p style="margin:0 0 18px">Enter what you're bringing to school today. Each day starts fresh.</p><button class="btn" style="background:white;color:#d54b1a" data-action="startform">Start today's sales →</button></div>`;if(state.days.some(d=>d.date===todayKey()))html+=`<p class="note">Today's session has already been completed. View it in History.</p>`}
else{const t=dayTotals(a);html+=`<div class="panel hero"><div class="sub">Today's revenue</div><div class="metric">${money(t.revenue)}</div><div class="sub">${t.sold} sold · ${t.remaining} remaining</div></div><div class="sectionhead"><h2>Tap to sell</h2><span class="pill">${a.items.length} products</span></div><div class="panel">${a.items.length?dayItems(a):'<div class="empty">No products in this day.</div>'}</div><div class="actions"><button class="btn secondary" data-action="addtoday">+ Add stock / product</button><button class="btn ghost" data-action="end">End day</button></div><p class="note">Each tap saves automatically. Use − to undo a sale.</p>`}
$('#today').innerHTML=html}
function renderProducts(){let html=`<div class="sectionhead"><h2>Products</h2><button class="btn small" data-action="productform">+ Add product</button></div><p class="note">Save your usual snacks and prices here. Daily quantities are entered separately.</p><div class="panel">`;html+=state.products.length?state.products.map(p=>`<div class="product"><div class="emoji">${escapeHTML(p.emoji)}</div><div class="grow"><div class="name">${escapeHTML(p.name)}</div><div class="sub muted">${money(p.price)}</div></div><button class="btn secondary small" data-action="editproduct" data-id="${p.id}">Edit</button></div>`).join(''):'<div class="empty">No products yet. Add your first snack or drink!</div>';$('#products').innerHTML=html+'</div>'}
function renderHistory(){let html='<div class="sectionhead"><h2>Sales history</h2></div>';if(historyId){const d=state.days.find(x=>x.id===historyId);if(d){const t=dayTotals(d);html+=`<button class="btn ghost small" data-action="backhistory">← All days</button><div class="panel" style="margin-top:12px"><h2>${dateLabel(d.date)}</h2><div class="metric">${money(t.revenue)}</div><p class="muted">${t.sold} sold · ${t.remaining} remaining</p><table class="summarytable"><thead><tr><th>Product</th><th>Brought</th><th>Sold</th><th>Left</th></tr></thead><tbody>${d.items.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${p.start}</td><td>${p.sold}</td><td>${p.start-p.sold}</td></tr>`).join('')}</tbody></table></div>`}else historyId=null}
if(!historyId){html+=state.days.length?state.days.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{const t=dayTotals(d);return `<div class="panel" data-history="${d.id}" role="button" tabindex="0" style="cursor:pointer"><div class="row"><div><div class="name">${dateLabel(d.date)}</div><div class="sub muted">${t.sold} items sold</div></div><div style="text-align:right"><div class="name">${money(t.revenue)}</div><div class="sub muted">View details →</div></div></div></div>`}).join(''):'<div class="panel empty">Completed days will appear here.</div>'}$('#history').innerHTML=html}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderWeekly(){const start=monday(new Date());start.setDate(start.getDate()+7*weekOffset);const end=new Date(start);end.setDate(end.getDate()+6);const ds=state.days.filter(d=>d.date>=localDate(start)&&d.date<=localDate(end));const groups=new Map();let sold=0,revenue=0;for(const d of ds)for(const p of d.items){const k=p.id+'|'+p.name+'|'+p.price;if(!groups.has(k))groups.set(k,{name:p.name,sold:0,revenue:0});const g=groups.get(k);g.sold+=p.sold;g.revenue+=p.sold*p.price;sold+=p.sold;revenue+=p.sold*p.price}
$('#weekly').innerHTML=`<h2>Weekly summary</h2><div class="panel weeknav"><button data-action="prevweek" aria-label="Previous week">←</button><strong>${start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</strong><button data-action="nextweek" aria-label="Next week">→</button></div><div class="stats"><div class="panel"><div class="sub muted">Revenue</div><div class="metric">${money(revenue)}</div></div><div class="panel"><div class="sub muted">Items sold</div><div class="metric">${sold}</div></div></div><div class="panel"><div class="row"><h2 style="margin:0">By product</h2><span class="pill">${ds.length} days</span></div>${groups.size?`<table class="summarytable"><thead><tr><th>Product</th><th>Sold</th><th>Revenue</th></tr></thead><tbody>${[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<tr><td>${escapeHTML(g.name)}</td><td>${g.sold}</td><td>${money(g.revenue)}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${sold}</td><td>${money(revenue)}</td></tr></tbody></table>`:'<div class="empty">No completed sales days this week.</div>'}</div><div class="panel"><h2>Backup & transfer</h2><p class="note">Export a CSV for your spreadsheet, or save a full JSON backup to protect your records. Exports work offline.</p><div class="actions"><button class="btn secondary" data-action="csv">Export CSV</button><button class="btn secondary" data-action="backup">Backup data</button></div><div style="margin-top:12px"><button class="btn ghost full" data-action="restore">Restore backup</button></div></div>`}
function render(){renderToday();renderProducts();renderHistory();renderWeekly();$$('main section').forEach(s=>s.classList.toggle('hide',s.id!==tab));$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab))}
function switchTab(t){tab=t;historyId=null;render();window.scrollTo(0,0)}
function productForm(p){dialog(`<h2>${p?'Edit product':'Add product'}</h2><form id="productForm"><label class="field">Product name<input name="name" maxlength="60" required value="${escapeHTML(p?.name||'')}" placeholder="e.g. Coke"></label><div class="fields"><label class="field">Price ($)<input name="price" type="number" min="0" max="9999" step="0.01" required value="${p?(p.price/100).toFixed(2):''}" placeholder="2.00"></label><label class="field">Emoji<input name="emoji" maxlength="8" value="${escapeHTML(p?.emoji||'')}" placeholder="🍿 (optional)"></label></div><div class="actions"><button type="button" class="btn ghost" data-action="close">Cancel</button><button class="btn" type="submit">Save product</button></div>${p?'<button type="button" class="btn danger full" style="margin-top:12px" data-action="deleteproduct" data-id="'+p.id+'">Remove product</button>':''}</form>`);$('#productForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),price=Math.round(Number(f.get('price'))*100),emoji=String(f.get('emoji')).trim()||'🍿';if(!name||!Number.isSafeInteger(price)||price<0){toast('Check product name and price');return}if(p){Object.assign(p,{name,price,emoji})}else state.products.push({id:id(),name,price,emoji});closeDialog();await commit();toast('Product saved')}}
function startForm(extra=false){const active=state.active;if(!extra && state.days.some(d=>d.date===todayKey())){toast('Today has already been completed');return}const candidates=state.products.filter(p=>!extra||!active.items.some(i=>i.id===p.id));if(!candidates.length){dialog(`<h2>No products available</h2><p>Add a product in Products first.</p><button class="btn full" data-action="close">OK</button>`);return}dialog(`<h2>${extra?'Add to today':'Start today'}</h2><p class="note">Enter quantities you're taking to school. Leave products at zero to skip them.</p><form id="startForm">${candidates.map(p=>`<label class="field"><span>${escapeHTML(p.emoji)} ${escapeHTML(p.name)} · ${money(p.price)}</span><input name="${p.id}" type="number" inputmode="numeric" min="0" max="99999" step="1" value="0" required></label>`).join('')}<div class="actions"><button class="btn ghost" type="button" data-action="close">Cancel</button><button class="btn" type="submit">${extra?'Add stock':'Start selling'}</button></div></form>`);$('#startForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),items=[];for(const p of candidates){const n=Number(f.get(p.id));if(!Number.isSafeInteger(n)||n<0||n>99999){toast('Enter valid whole quantities');return}if(n>0)items.push({...p,start:n,sold:0})}if(!items.length){toast('Enter at least one quantity');return}if(extra){active.items.push(...items)}else{state.active={id:id(),date:todayKey(),items}}closeDialog();await commit();toast(extra?'Stock added':'Day started')}}
function endDay(){const a=state.active;if(!a)return;const t=dayTotals(a);dialog(`<h2>End this day?</h2><p>${dateLabel(a.date)}</p><p><strong>${t.sold} sold · ${money(t.revenue)} revenue</strong></p><p class="note">This saves a permanent history entry. Unsold inventory will not carry over to the next day.</p><div class="actions"><button class="btn ghost" data-action="close">Keep selling</button><button class="btn" data-action="confirmend">End & save</button></div>`)}
function csvCell(v){return '"'+String(v).replace(/"/g,'""')+'"'}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function exportCSV(){const lines=[['Date','Product','Price ($)','Brought','Sold','Left','Revenue ($)']];for(const d of state.days.slice().sort((a,b)=>a.date.localeCompare(b.date)))for(const p of d.items)lines.push([d.date,p.name,(p.price/100).toFixed(2),p.start,p.sold,p.start-p.sold,(p.sold*p.price/100).toFixed(2)]);download('\ufeff'+lines.map(r=>r.map(csvCell).join(',')).join('\r\n'),'snack-attack-sales.csv','text/csv;charset=utf-8');toast('Sales CSV exported')}
function restoreForm(){dialog(`<h2>Restore backup</h2><p class="note">Restoring replaces all current products, completed days, and any open day. Export a backup first if you need the current data.</p><label class="field">Select Snack Attack JSON backup<input type="file" id="restoreFile" accept=".json,application/json"></label><div class="actions"><button class="btn ghost" data-action="close">Cancel</button><button class="btn danger" data-action="confirmrestore">Restore</button></div>`)}
async function handleAction(e){const el=e.target.closest('[data-action]');if(!el||saving)return;const a=el.dataset.action,productId=el.dataset.id;if(a==='close')return closeDialog();if(a==='productform')return productForm();if(a==='editproduct')return productForm(state.products.find(p=>p.id===productId));if(a==='deleteproduct'){if(!confirm('Remove this product from future days? Existing daily records will be kept.'))return;state.products=state.products.filter(p=>p.id!==productId);closeDialog();await commit();return}if(a==='startform')return startForm();if(a==='addtoday')return startForm(true);if(a==='end')return endDay();if(a==='confirmend'){if(state.days.some(d=>d.date===state.active.date)){toast('A completed record already exists for this date');return}state.days.push(state.active);state.active=null;closeDialog();await commit();toast('Day saved');return}if(a==='plus'||a==='minus'){const p=state.active?.items.find(p=>p.id===productId);if(!p)return;if(a==='plus'&&p.sold<p.start)p.sold++;if(a==='minus'&&p.sold>0)p.sold--;await commit();return}if(a==='backhistory'){historyId=null;render();return}if(a==='prevweek'||a==='nextweek'){weekOffset+=a==='prevweek'?-1:1;render();return}if(a==='csv')return exportCSV();if(a==='backup'){download(JSON.stringify(state,null,2),'snack-attack-backup-'+todayKey()+'.json','application/json');toast('Backup exported');return}if(a==='restore')return restoreForm();if(a==='confirmrestore'){const file=$('#restoreFile').files[0];if(!file){toast('Choose a backup file');return}try{const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.products)||!Array.isArray(data.days)||!('active'in data)||data.days.some(d=>!Array.isArray(d.items))){throw Error('Invalid backup')}if(!confirm('Replace all current app data with this backup?'))return;state=data;closeDialog();await commit();toast('Backup restored')}catch(err){alert('This is not a valid Snack Attack backup.')}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){switchTab(t.dataset.tab);return}const h=e.target.closest('[data-history]');if(h){historyId=h.dataset.history;tab='history';render();return}handleAction(e)});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-history]')){historyId=e.target.dataset.history;render()}});
(async()=>{try{await load();render();if('serviceWorker'in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){console.error(e);document.querySelector('main').insertAdjacentHTML('beforeend','<div class="panel"><h2>Storage unavailable</h2><p>Snack Attack needs local device storage. Open it in Safari or a modern browser over HTTPS (or localhost), not in private browsing or directly from a ZIP file.</p></div>')}})();
</script><aside id="updateNotice" role="status" aria-live="polite" hidden><strong>Snack Attack update ready</strong><div>A new version is downloaded. Apply it when you're finished recording sales.</div><div class="update-actions"><button type="button" id="applyUpdate">Restart to update</button><button type="button" class="secondary" id="laterUpdate">Later</button></div></aside><script>
(()=>{'use strict';
if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
let pending=null, refreshing=false, deferred=false;
const notice=document.getElementById('updateNotice');
const footer=document.getElementById('deferredUpdate');
const show=worker=>{if(!worker||!navigator.serviceWorker.controller)return;pending=worker;if(deferred){footer.hidden=false;}else{notice.hidden=false;footer.hidden=true;}};
document.getElementById('laterUpdate').addEventListener('click',()=>{deferred=true;notice.hidden=true;footer.hidden=!pending;});
const apply=()=>{if(!pending)return;notice.hidden=true;footer.hidden=true;pending.postMessage({type:'SKIP_WAITING'});};
document.getElementById('applyUpdate').addEventListener('click',apply);
document.getElementById('footerApplyUpdate').addEventListener('click',apply);
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
navigator.serviceWorker.ready.then(reg=>{
 if(reg.waiting)show(reg.waiting);
 const watch=worker=>{if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed')show(worker);});};
 reg.addEventListener('updatefound',()=>watch(reg.installing));
 const check=()=>{if(reg.waiting)show(reg.waiting);if(navigator.onLine)reg.update().then(()=>{if(reg.waiting)show(reg.waiting);}).catch(()=>{});};
 check();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
 window.addEventListener('online',check);
}).catch(console.warn);
})();
</script></body></html>
